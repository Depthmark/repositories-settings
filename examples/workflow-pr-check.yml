# Example workflow for repos that want to drive the repo-settings
# service from GitHub Actions instead of (or alongside) the App webhook.
#
# Two paths:
#   1. pull_request — every PR that touches .github/settings/** runs a
#      dry-run and posts the diff as a sticky PR comment.
#   2. workflow_dispatch — a maintainer can manually request a dry-run
#      or a real apply against the default branch.
#
# Before enabling this static-token example, create the repo-settings
# environment with required reviewers and trusted deployment branches.
# Store these environment secrets there:
#   REPO_SETTINGS_URL    — base URL of the repo-settings service
#                          (e.g. https://repo-settings.example.com)
#   REPO_SETTINGS_TOKEN  — value of API_TOKEN configured on the service
# This token is operator-wide. Prefer the OIDC reusable workflow for
# repository-scoped credentials without a shared service secret.
#
# Note on the App webhook: if your org has the repo-settings GitHub App
# installed, it already posts a sticky PR comment on PR open / sync.
# Running this workflow in addition produces TWO comments per PR (the
# stickies use different markers and don't collide). Omit this workflow
# when the App webhook already supplies the desired checks and comments.
# Keep the App installed: the service needs its installation credentials
# to read repository settings and apply changes.

name: repo-settings

on:
  pull_request:
    paths:
      - ".github/settings/**"
      - ".github/workflows/repo-settings-check.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode against the default branch."
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

# Declared per job, not workflow-wide: only the PR job posts a comment,
# and the manual job has no reason to hold write access to pull requests.
permissions: {}

concurrency:
  group: repo-settings-example-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR dry-run: read-only, posts the sticky diff comment.
  # Skips fork PRs because secrets aren't injected for them; the App
  # webhook is the right place to validate fork contributions.
  pr-check:
    name: Check proposed settings
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: repo-settings
    permissions:
      pull-requests: write  # Upsert the sticky dry-run comment
    steps:
      - name: Call /api/check
        id: check
        env:
          URL: ${{ secrets.REPO_SETTINGS_URL }}
          TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg owner "$OWNER" \
            --arg repo  "$REPO" \
            --arg sha   "$HEAD_SHA" \
            --argjson pr "$PR" \
            '{owner:$owner, repo:$repo, head_sha:$sha, pr_number:$pr}')
          curl -sS --fail-with-body -X POST "$URL/api/check" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            -o /tmp/check.json
          conclusion=$(jq -er '.conclusion | select(. == "success" or . == "neutral" or . == "failure")' /tmp/check.json)
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
          # Keep server-rendered Markdown out of the output command file.
          {
            printf '## repo-settings - dry run (%s)\n\n' "$conclusion"
            jq -r .summary /tmp/check.json
            printf '\n<sub>Run: [%s](%s/%s/actions/runs/%s)</sub>\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > /tmp/check.md

      - name: Upsert sticky PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: repo-settings-check
          path: /tmp/check.md

      - name: Fail the check on a lane error
        if: steps.check.outputs.conclusion == 'failure'
        run: |
          echo "::error::repo-settings reported a lane failure during the dry-run"
          exit 1

  # Manual run against the default branch. Requires write access to
  # dispatch the workflow, so an "apply" choice is already gated on the
  # same permission as `@repo-settings apply` from a PR comment.
  manual:
    name: Reconcile default-branch settings
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: repo-settings
    permissions: {}
    steps:
      - name: Call /api/reconcile
        env:
          URL: ${{ secrets.REPO_SETTINGS_URL }}
          TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg owner "$OWNER" \
            --arg repo  "$REPO" \
            --argjson dry "$DRY_RUN" \
            '{owner:$owner, repo:$repo, dry_run:$dry}')
          curl -sS --fail-with-body -X POST "$URL/api/reconcile" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            -o /tmp/reconcile.json
          echo "## repo-settings — ${MODE}" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            "Applied \(.applied | length) result(s); failures: \([.applied[] | select(.success==false)] | length)"
          ' /tmp/reconcile.json >> "$GITHUB_STEP_SUMMARY"
          # Surface non-zero exit when any lane failed during a real apply.
          if [ "$DRY_RUN" = "false" ] && jq -e '[.applied[] | select(.success==false)] | length > 0' /tmp/reconcile.json > /dev/null; then
            echo "::error::one or more lanes failed during apply"
            exit 1
          fi
