---
# Low-level reusable workflow for repo-settings.
#
# Most consumers should use repo-settings-default.yml (same directory),
# which wraps this one with org-baked defaults. Call THIS workflow
# directly only when you need to override something the wrapper hardcodes.
#
#   name: repo-settings
#   on:
#     push:
#       branches: [main]
#       paths: ['.github/settings/**']
#     pull_request:
#       paths: ['.github/settings/**']
#   permissions:
#     contents: read
#     pull-requests: write    # for the dry-run sticky comment
#     id-token: write         # see "Authentication" below
#   jobs:
#     settings:
#       uses: Depthmark/repositories-settings/.github/workflows/repo-settings.yml@<verified-full-commit-sha>
#       with:
#         auth-mode: oidc
#
# Authentication
# --------------
# auth-mode: oidc (recommended) authenticates with the short-lived token
# GitHub mints for this workflow. The token names this repository, and
# the service will only reconcile the repository its caller proves it
# runs in — so a leaked token cannot reconfigure anything else, and there
# is no shared secret to distribute or rotate.
#
# auth-mode: token sends a static secret that every repository shares.
# It is not repository-scoped: whoever holds it can reconcile any
# repository the App is installed in. Use it only for a trusted operator
# workflow when OIDC is unavailable.
#
# `id-token: write` must be granted by the caller in either mode, because
# a reusable workflow can only narrow the permissions it is given. The
# permission alone grants no repository access — it only allows
# requesting an identity token — and it is unused in token mode.

name: repo-settings

on:
  workflow_call:
    inputs:
      api-url:
        description: "repo-settings service URL"
        required: false
        type: string
        default: "https://repo-settings.internal"
      auth-mode:
        description: |
          How to authenticate to the service: "oidc" (this workflow's
          GitHub identity token, repository-scoped) or "token" (the
          shared api-token secret, not repository-scoped).
        required: false
        type: string
        default: "oidc"
      oidc-audience:
        description: |
          Audience to request for the identity token. Must equal the
          service's OIDC_AUDIENCE. Ignored when auth-mode is "token".
        required: false
        type: string
        default: "repo-settings"
    secrets:
      api-token:
        description: |
          Static token matching the repo-settings service API_TOKEN.
          Required when auth-mode is "token"; unused otherwise.
        required: false

permissions: {}

jobs:
  settings:
    name: repo-settings
    # Fork contributions are checked by the App webhook. A feature-branch
    # push must never reach a mutation-capable service request.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.event.deleted == false &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-slim
    permissions:
      contents: read        # Read .github/settings/*.yml for schema validation
      pull-requests: write  # Post and update the dry-run sticky PR comment
      id-token: write       # Mint this workflow's identity token (auth-mode: oidc)
    steps:
      # --- Pre-flight: validate YAML schemas ---
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate settings schemas
        env:
          API_URL: ${{ inputs.api-url }}
        run: |
          # Collect all .github/settings/*.yml files into a JSON array.
          FILES="[]"
          for f in .github/settings/*.yml; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            FILES=$(jq --arg name "$NAME" --arg content "$(cat "$f")" \
              '. + [{"name": $name, "content": $content}]' <<< "$FILES")
          done

          if [ "$FILES" = "[]" ]; then
            echo "No settings files found"
            exit 0
          fi

          # -f would discard the body on HTTP errors; we need the body
          # (the API returns 422 with per-file errors when YAML is invalid).
          HTTP_CODE=$(curl -s -o /tmp/validate-response.json \
            -w '%{http_code}' \
            -X POST "${API_URL}/api/validate" \
            -H "Content-Type: application/json" \
            -d "{\"files\": ${FILES}}")
          RESPONSE=$(cat /tmp/validate-response.json)

          {
            echo "<details>"
            echo "<summary>Schema Validation — HTTP ${HTTP_CODE}</summary>"
            echo
            echo '```json'
            jq . <<< "$RESPONSE" 2>/dev/null || printf '%s\n' "$RESPONSE"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Anything outside 2xx/422 is a transport/server problem, not a
          # validation result — surface it loudly.
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "422" ]; then
            echo "::error::Validate API returned HTTP ${HTTP_CODE}"
            printf '%s\n' "$RESPONSE"
            exit 1
          fi

          VALID=$(jq -r '.valid // false' <<< "$RESPONSE")
          if [ "$VALID" != "true" ]; then
            echo "::error::Schema validation failed — check the summary for details"
            jq -r '.files[] | select(.valid == false) | "  \(.file): \(.issues | join("; "))"' <<< "$RESPONSE" 2>/dev/null
            exit 1
          fi
          echo "All settings files are valid"

      # --- Resolve the API credential ---
      # Both modes end at the same place: REPO_SETTINGS_BEARER in the
      # job environment, masked, so every later step sends one header
      # and neither knows which mode produced it.
      - name: Resolve service credential
        env:
          AUTH_MODE: ${{ inputs.auth-mode }}
          OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
          API_TOKEN: ${{ secrets.api-token }}  # zizmor: ignore[secrets-outside-env]
        run: |
          set -euo pipefail

          if [ "$AUTH_MODE" = "oidc" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::auth-mode is oidc but no identity token is available."
              echo "::error::Grant 'id-token: write' in the calling workflow's permissions."
              exit 1
            fi
            # The request token authenticates this job to the Actions
            # identity endpoint; it is not the credential we send on.
            BEARER=$(curl -sS --fail-with-body --get \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --data-urlencode "audience=${OIDC_AUDIENCE}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" \
              | jq -r '.value')
            if [ -z "$BEARER" ] || [ "$BEARER" = "null" ]; then
              echo "::error::the Actions identity endpoint returned no token"
              exit 1
            fi
            echo "Authenticating with this workflow's GitHub identity (audience: ${OIDC_AUDIENCE})"
          elif [ "$AUTH_MODE" = "token" ]; then
            if [ -z "${API_TOKEN:-}" ]; then
              echo "::error::auth-mode is token but the api-token secret is empty."
              echo "::error::Pass secrets.api-token, or switch to auth-mode: oidc."
              exit 1
            fi
            BEARER="$API_TOKEN"
            echo "Authenticating with the shared static token (not repository-scoped)"
          else
            echo "::error::auth-mode must be oidc or token"
            exit 1
          fi

          # Mask before the value can reach any later log line.
          echo "::add-mask::${BEARER}"
          echo "REPO_SETTINGS_BEARER=${BEARER}" >> "$GITHUB_ENV"

      # --- PR Check ---
      - name: PR Check (dry-run)
        id: check
        if: github.event_name == 'pull_request'
        env:
          API_URL: ${{ inputs.api-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Build curl args as an array so word-splitting / quoting are clean.
          HEADERS=(
            -H "Content-Type: application/json"
            -H "Authorization: Bearer ${REPO_SETTINGS_BEARER}"
          )

          BODY=$(jq -n \
            --arg owner "$REPO_OWNER" \
            --arg repo "$REPO_NAME" \
            --arg head_sha "$HEAD_SHA" \
            --argjson pr_number "${PR_NUMBER:-null}" \
            '{owner: $owner, repo: $repo, head_sha: $head_sha, pr_number: $pr_number}')

          # -s + -o + -w lets us see the body even on non-2xx, instead
          # of having `-f` swallow everything with exit code 22.
          HTTP_CODE=$(curl -s -o /tmp/check.json -w '%{http_code}' \
            -X POST "${API_URL}/api/check" \
            "${HEADERS[@]}" \
            -d "$BODY")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::/api/check returned HTTP ${HTTP_CODE}"
            cat /tmp/check.json
            exit 1
          fi

          CONCLUSION=$(jq -r '.conclusion // "unknown"' /tmp/check.json)
          # Persist the markdown summary to a file so the comment step
          # can read it without round-tripping through GITHUB_OUTPUT
          # (which is fragile for multi-line markdown with backticks).
          jq -r '.summary // ""' /tmp/check.json > /tmp/check.md

          # Print the markdown summary inline so a reviewer scrolling
          # the run logs sees the diff without leaving the page. The
          # /api/check `summary` already starts with its own H2
          # verdict line, so we don't add another one here.
          echo "::group::repo-settings dry-run (${CONCLUSION})"
          cat /tmp/check.md
          echo "::endgroup::"

          # Mirror to the step summary verbatim — the formatter owns
          # the verdict, sections, and apply hint, so the step summary
          # and the sticky PR comment are byte-identical.
          cat /tmp/check.md >> "$GITHUB_STEP_SUMMARY"

          # Expose conclusion to the comment step. The step runs with
          # `if: always()` and reads /tmp/check.md directly.
          echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"

          if [ "$CONCLUSION" = "failure" ]; then
            echo "::error::dry-run reported lane errors — see Errors section"
            jq -r '
              .report.applied[]
              | select(.success == false)
              | "  - \(.resource) (\(.action)): \(.error)"
            ' /tmp/check.json
            exit 1
          fi

      # --- Sticky PR comment ---
      # Find by marker → PATCH if present, else POST a new comment.
      # Uses the GitHub-issued GITHUB_TOKEN, no third-party action.
      # Runs even when PR Check exited 1 (always()) so a failed dry-run
      # still leaves the breakdown on the PR. continue-on-error so a
      # transient comment failure doesn't mask the real check result.
      - name: Comment dry-run on PR
        if: always() && github.event_name == 'pull_request' && steps.check.outputs.conclusion != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
        run: |
          set -euo pipefail
          MARKER='<!-- repo-settings:workflow -->'

          # Compose the comment body. The /api/check `summary` field
          # is the entire comment — verdict line, sections, apply hint
          # — so we just sandwich it between the find-by-prefix marker
          # and a footer linking back to the run. No wrapper headers:
          # the formatter is the single source of truth for layout, so
          # the bot's webhook-driven comment and this workflow-driven
          # comment look identical.
          {
            printf '%s\n\n' "$MARKER"
            if [ -s /tmp/check.md ]; then
              cat /tmp/check.md
            else
              echo "_No summary returned by /api/check._"
            fi
            echo
            printf '<sub>Run: [%s](%s/%s/actions/runs/%s)</sub>\n' \
              "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID"
          } > /tmp/comment.md

          # Wrap the body in a JSON object once, then feed both POST
          # and PATCH from the same payload — keeps the two paths
          # symmetrical and avoids re-encoding.
          jq -Rs '{body: .}' < /tmp/comment.md > /tmp/comment.json

          EXISTING_ID=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating sticky comment ${EXISTING_ID}"
            gh api --method PATCH "repos/$REPO/issues/comments/$EXISTING_ID" \
              --input /tmp/comment.json > /dev/null
          else
            echo "Posting new sticky comment"
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              --input /tmp/comment.json > /dev/null
          fi

      # --- Detect changed settings files (for selective reconciliation) ---
      - name: Detect changed files
        if: github.event_name == 'push'
        id: changed
        env:
          # Pass commits via env, never inline `${{ ... }}` into shell.
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          # Actions push payloads can omit per-commit file lists. In that
          # case reconcile all settings rather than silently filtering
          # every resource out. An explicit empty list still means no
          # settings changed when all commit file lists were supplied.
          CHANGED=$(jq -c '
            if type != "array" or length == 0 then null
            elif all(.[]; has("added") and has("modified") and has("removed")) then
              [.[] | (.added + .modified + .removed)[]
               | select(startswith(".github/settings/"))] | unique
            else null end
          ' <<< "$COMMITS_JSON")
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed settings files: ${CHANGED}"

      # --- Apply on merge ---
      - name: Apply settings
        if: >-
          github.event_name == 'push' && github.event.deleted == false &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          API_URL: ${{ inputs.api-url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          HEADERS=(
            -H "Content-Type: application/json"
            -H "Authorization: Bearer ${REPO_SETTINGS_BEARER}"
          )

          set -euo pipefail

          BODY=$(jq -n \
            --arg owner "$REPO_OWNER" \
            --arg repo "$REPO_NAME" \
            --argjson changed_files "${CHANGED_FILES:-null}" \
            '{owner: $owner, repo: $repo} +
             if $changed_files == null then {} else {changed_files: $changed_files} end')

          # -s + -o + -w lets us see the body even on non-2xx, instead
          # of having `-f` swallow everything with exit code 22. We need
          # the body either way (per-lane errors live in applied[]).
          HTTP_CODE=$(curl -s -o /tmp/reconcile.json -w '%{http_code}' \
            -X POST "${API_URL}/api/reconcile" \
            "${HEADERS[@]}" \
            -d "$BODY")

          # The server renders the canonical summary (verdict line,
          # error table with resource/action/reason, per-action tables)
          # via reconciler.FormatReportMarkdown — same formatter the
          # dry-run sticky comment uses. Write that to the step summary
          # verbatim so a reviewer scrolling the run sees clear failure
          # reasons, then keep the raw JSON in a collapsed block for
          # debugging.
          SUMMARY=$(jq -r '.summary // ""' /tmp/reconcile.json)
          {
            if [ -n "$SUMMARY" ]; then
              printf '%s\n' "$SUMMARY"
            else
              echo "## repo-settings applied (HTTP ${HTTP_CODE})"
              echo "_/api/reconcile did not return a rendered summary._"
            fi
            echo
            echo "<details>"
            echo "<summary>Raw /api/reconcile response (HTTP ${HTTP_CODE})</summary>"
            echo
            echo '```json'
            jq 'del(.summary)' /tmp/reconcile.json 2>/dev/null || cat /tmp/reconcile.json
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::/api/reconcile returned HTTP ${HTTP_CODE}"
            cat /tmp/reconcile.json
            exit 1
          fi

          # The server runs every lane to completion in parallel; per-lane
          # failures (e.g. 403 from missing perms, 422 from GitHub
          # rejecting a value) are embedded in applied[] with
          # success=false alongside the successful creates/updates/deletes.
          # Print every lane's outcome to the run log so the operator sees
          # the full feedback loop — what was created/updated/deleted and
          # what failed — in one place. We only decide the exit code
          # after surfacing everything.
          echo "::group::repo-settings — per-lane results"
          jq -r '
            .applied[]
            | if .success and .action == "skipped" then
                "  - \(.resource) skipped: \(.error // "no reason")"
              elif .success then
                "  ok   \(.resource) (\(.action))"
              else
                "  FAIL \(.resource) (\(.action)): \(.error)"
              end
          ' /tmp/reconcile.json
          echo "::endgroup::"

          TOTAL=$(jq '.applied | length' /tmp/reconcile.json)
          FAILED=$(jq '[.applied[] | select(.success == false)] | length' /tmp/reconcile.json)
          echo "Lanes: ${TOTAL} total, ${FAILED} failed"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED}/${TOTAL} lane(s) failed during apply — see per-lane results above"
            exit 1
          fi
