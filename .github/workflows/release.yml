---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.0). Use to retry a failed release."
        required: true
        type: string

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: run full CI before releasing.
  # ─────────────────────────────────────────────────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ─────────────────────────────────────────────────────────────────────────
  # Build and push Docker image to GHCR.
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    needs: [ci]
    uses: Depthmark/reusable-workflows/.github/workflows/docker-build-push.yml@55c7a3dbce97a8ba6ea8ed45fc26463b1b8a1f77 # v1.2.0
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
      sign: true
      attest: false
    permissions:
      contents: read
      packages: write       # Push the container image to the registry
      id-token: write       # Keyless signing identity for the published image
      attestations: write   # Record the build provenance attestation
