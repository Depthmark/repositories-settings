---
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: Depthmark/github-sts-action@66fb1a28c2f57b75b39ae7dfdfb72a44bb8836ea # main
        id: sts
        with:
          sts-url: https://github-sts-dev.adelisle.com
          scope: Depthmark/template-go
          identity: release
          app: depthmark-release-bot

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.sts.outputs.token }}
