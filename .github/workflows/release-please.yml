---
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Create release commits, tags, and GitHub releases
      pull-requests: write  # Open and update the release pull request
      id-token: write       # Exchange this workflow's identity for an App token
    steps:
      - uses: Depthmark/github-sts-action@9014c80f47cad81e0a1295b112714d5c1b219d54 # v0.3.0
        id: sts
        with:
          sts-url: https://github-sts.adelisle.com
          audience: github-sts
          scope: Depthmark/repositories-settings
          identity: release
          app: depthmark-release-bot

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.sts.outputs.token }}
