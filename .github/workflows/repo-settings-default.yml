---
# Opinionated wrapper around repo-settings.yml with org-baked defaults.
# Consumer repos call THIS instead of the low-level workflow so they
# don't each have to memorize the low-level workflow interface.
#
# Lives alongside repo-settings.yml in this repo at:
#   .github/workflows/repo-settings-default.yml
#
# Consumer usage (.github/workflows/repo-settings.yml in any target repo):
#
#   name: repo-settings
#   on:
#     push: { branches: [main], paths: ['.github/settings/**'] }
#     pull_request: { paths: ['.github/settings/**'] }
#   permissions:
#     contents: read
#     pull-requests: write    # for the dry-run sticky comment
#     id-token: write         # authenticates this repo to the service
#   jobs:
#     settings:
#       uses: Depthmark/repositories-settings/.github/workflows/repo-settings-default.yml@<verified-full-commit-sha>
#       with:
#         api-url: https://repository-settings.example.com
#
# This wrapper defaults to OIDC: the workflow authenticates with the
# short-lived identity token GitHub mints for it, which names this
# repository, so the service will only reconcile this repository. There
# is no shared secret to distribute or rotate. A trusted operator
# workflow can pass auth-mode: token and secrets.api-token when OIDC is
# unavailable. The service can accept both configured credential types.
#
# If a repo needs to override any of the baked defaults (e.g. staging
# API URL), call repo-settings.yml directly instead.

name: repo-settings (default)

on:
  workflow_call:
    inputs:
      api-url:
        description: "repo-settings service URL"
        required: true
        type: string
      auth-mode:
        description: |
          "oidc" (default) authenticates with this workflow's GitHub
          identity token and is scoped to this repository. "token" sends
          the shared api-token secret and is not.
        required: false
        type: string
        default: "oidc"
      oidc-audience:
        description: "Must equal the service's OIDC_AUDIENCE."
        required: false
        type: string
        default: "repo-settings"
    secrets:
      api-token:
        description: |
          Static token matching the repo-settings service API_TOKEN.
          Required only when auth-mode is "token".
        required: false

permissions: {}

jobs:
  settings:
    uses: ./.github/workflows/repo-settings.yml
    permissions:
      contents: read        # Read .github/settings/*.yml for schema validation
      pull-requests: write  # Post and update the dry-run sticky PR comment
      id-token: write       # Mint this workflow's identity token (auth-mode: oidc)
    with:
      api-url: ${{ inputs.api-url }}
      auth-mode: ${{ inputs.auth-mode }}
      oidc-audience: ${{ inputs.oidc-audience }}
    secrets:
      # Explicit forwarding — narrower than `secrets: inherit` and
      # passes only what the called workflow actually declares.
      api-token: ${{ secrets.api-token }}
